name: Bump version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "What version level of bump?"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      - name: Set git config
        run: |
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "$(gh api "/users/${GITHUB_ACTOR}" | jq -r '.name // .login')"
        shell: bash
      - name: Bump version
        env:
          LEVEL: ${{ inputs.version }}
        run: gem exec bump "$LEVEL"
      - name: Push
        run: git push
