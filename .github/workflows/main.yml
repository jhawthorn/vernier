name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }}${{ matrix.yjit == 1 && ' +YJIT' || '' }}${{ matrix.mn_threads == 1 && ' +MN' || '' }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"

        os:
          - ubuntu-latest
          - macos-latest

        yjit: [0]
        mn_threads: [0]

        include:
          - os: ubuntu-latest
            ruby: "4.0"
            mn_threads: 1
          - os: ubuntu-latest
            ruby: "head"
            mn_threads: 1

          - os: ubuntu-latest
            ruby: "4.0"
            yjit: 1
          - os: ubuntu-latest
            ruby: "head"
            yjit: 1

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
        timeout-minutes: 5
        env:
          VERNIER_ALWAYS_ASSERT: "1"
          RUBY_YJIT_ENABLE: ${{ matrix.yjit }}
          RUBY_MN_THREADS: ${{ matrix.mn_threads }}
          TESTOPTS: "-v"

  # Loads the output into the Firefox profiler via @firefox-devtools/profiler-cli
  firefox-profiler:
    name: Firefox profiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g @firefox-devtools/profiler-cli
      - run: bundle exec rake test TEST=test/test_firefox_profiler_cli.rb
        env:
          PROFILER_CLI: profiler-cli
