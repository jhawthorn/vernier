name: Push gem to RubyGems.org

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/${{ steps.gem.outputs.name }}

    permissions:
      contents: write
      id-token: write

    steps:
      # Set up
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
      # Install into Ruby's own gem directory rather than setup-ruby's vendored
      # cache. release-gem preloads RubyGems' push command (and with it the zlib
      # default gem) before bundler runs, so any default gem the Gemfile
      # resolves to a newer version must be visible to plain RubyGems or
      # bundler aborts with "You have already activated zlib X, but your Gemfile
      # requires zlib Y".
      - name: Install dependencies
        run: bundle install

      - name: Read gem name and version
        id: gem
        run: |
          ruby -e '
            spec = Gem::Specification.load(Dir["*.gemspec"].first)
            puts "name=#{spec.name}", "version=#{spec.version}"
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Check release tag matches gem version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.gem.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match gem version $VERSION"
            exit 1
          fi

      # Release
      - name: Push gem
        uses: rubygems/release-gem@v1
